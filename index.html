</style></head><body>

<script>
const pl=document.querySelector('.pill'),st=document.getElementById('st'),cl=document.getElementById('claw'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const T=n=>RM?0:n,sl=n=>new Promise(r=>setTimeout(r,T(n)));
const D=[
['PORT','FOLIO','#e5322d','#a91f1b','ADIT',.48,.66,-14,-24,6,.5,.64,'#ff8a82','01 / Hello','Hi, I’m <em>Adit.</em>','<p>A digital marketing student who turns content experiments into real enquiries. Every container holds a piece of my work.</p>'],
['THE','WORK','#f26a1f','#b84a10','02',.13,.86,-16,28,16,.17,.91,'#ffa05a','02 / Selected work','The <em>work.</em>','<ul><li><b>Vama Homestead</b> · 86+ posts, 37K+ views, 25+ enquiries</li><li><b>Inverted Cafe</b> · Instagram built to 16K+ views</li><li><b>CSR Outreach</b> · village drive for local goodwill</li></ul>'],
['ABOUT','ME','#1d55d8','#123a9c','03',.36,.90,-12,-20,-10,.5,.93,'#7fa8ff','03 / About me','A little about <em>me.</em>','<p>BBA in Digital Marketing &amp; E-commerce at Graphic Era, Dehradun. I test hooks, read the numbers and turn audience feedback into growth.</p>'],
['PRO','CESS','#f6b919','#c08a0a','04',.60,.88,-14,24,12,.84,.90,'#ffd23f','04 / Process','How I <em>work.</em>','<ul><li><b>01 Research</b> · SWOT, interviews, trends</li><li><b>02 Experiment</b> · A/B test emotional hooks</li><li><b>03 Iterate</b> · read analytics, improve</li></ul>'],
['TOOL','KIT','#97a1ad','#6c7682','05',.86,.86,-16,-30,-14,.20,.77,'#c9d2dd','05 / Toolkit','What’s in the <em>box.</em>','<div class="ch"><span>Google Analytics</span><span>Power BI</span><span>SQL</span><span>Figma</span><span>Meta Business Suite</span><span>Canva</span><span>CapCut</span></div>'],
['WHAT','I DO','#e5322d','#a91f1b','06',.25,.68,-14,30,-12,.52,.79,'#ff8a82','06 / What I do','What I <em>do.</em>','<div class="ch"><span>Brand strategy</span><span>Growth experiments</span><span>Content &amp; reels</span><span>Customer discovery</span></div>'],
['SAY','HELLO','#2546b8','#172f80','07',.73,.68,-14,-26,16,.82,.76,'#8aa4ff','07 / Say hello','Got an <em>idea?</em>','<p>Have a brand to grow, an experiment to run, or just want to say hi?</p><a class="cta" href="mailto:aditraizada3@gmail.com">aditraizada3@gmail.com ↗</a><a class="cta" href="https://linkedin.com/in/adit-raizada-2a7106341" target="_blank" rel="noopener">LinkedIn ↗</a>']];
let cs=[],held=-1,busy=0,q=null,ht;const hd=document.querySelector('.hand'),seen=new Set([0]);
function hint(){clearTimeout(ht);hd.classList.remove('show');if(seen.size>=D.length||busy||q!==null)return;ht=setTimeout(()=>{const n=D.findIndex((_,i)=>!seen.has(i));if(n<0)return;const g=G(n);hd.style.left=g.x+'px';hd.style.top=g.y+'px';hd.classList.add('show')},1400)}
D.forEach((d,i)=>{const c=document.createElement('div');c.className='c';c.style.cssText=`--c:${d[2]};--k:${d[3]};--a:${d[12]}`;
c.innerHTML=`<i class="p bk"></i><i class="p le"></i><i class="p ri"></i><i class="p tp"></i><i class="p bt"></i><div class="fr"><div class="wall" inert><div class="in"><div class="kk">${d[13]}</div><h2 tabindex="-1">${d[14]}</h2>${d[15]}<div><button class="nx" data-n="${(i+1)%7}">Next: ${D[(i+1)%7][0]} ${D[(i+1)%7][1]} →</button></div></div></div><div class="dl"><i class="o"><span class="lab">${d[0]}<br>${d[1]}</span></i><i class="n"></i></div><div class="dr"><i class="o"><span class="tag">${d[4]}</span></i><i class="n"></i></div><button class="hit" aria-label="Open ${d[0]} ${d[1]}"></button></div>`;
const hb=c.querySelector('.hit');hb.onclick=()=>pick(i);c.querySelector('.nx').onclick=e=>pick(+e.currentTarget.dataset.n);hb.onmouseenter=()=>{pl.textContent='OPEN '+d[0]+' '+d[1]+' →';pl.classList.add('h')};hb.onmouseleave=()=>{pl.textContent='PICK A CONTAINER ↓';pl.classList.remove('h')};st.appendChild(c);cs.push(c)});
function G(i){const p=innerWidth<=700,sw=st.clientWidth,sh=st.clientHeight,W=p?Math.min(150,sw*.34):Math.min(260,Math.max(170,sw*.17)),H=W*(p?.6:.43),k=p?2.6:2.3,d=D[i],yf=d[p?11:6];return{sw,W,H,Dp:W*(p?.56:.4),k,x:d[p?10:5]*sw,y:yf*sh,yf,cy:95+H*k/2}}
const rod=(cy,h)=>Math.max(8,cy-h/2-87);
function sz(c,w,h,d){c.style.setProperty('--w',w+'px');c.style.setProperty('--h',h+'px');c.style.setProperty('--d',d+'px')}
function pile(i,ms){const g=G(i),c=cs[i],d=D[i];c.style.setProperty('--t',T(ms)+'ms');Object.assign(c.style,{left:g.x+'px',top:g.y+'px',zIndex:Math.round(g.yf*10),transform:`rotateX(${d[7]}deg) rotateY(${d[8]}deg) rotateZ(${d[9]}deg)`});sz(c,g.W,g.H,g.Dp)}
function lift(i,ms){const g=G(i),c=cs[i];c.style.setProperty('--t',T(ms)+'ms');Object.assign(c.style,{left:g.sw/2+'px',top:g.cy+'px',zIndex:20,transform:'rotateX(-7deg) rotateY(-11deg) rotateZ(0deg)'});sz(c,g.W*g.k,g.H*g.k,g.Dp*g.k)}
function claw(x,r,w,h,ms,op){cl.style.setProperty('--t',T(ms)+'ms');cl.style.left=x+'px';cl.style.setProperty('--rod',r+'px');cl.style.setProperty('--span',1.06*w+'px');cl.style.setProperty('--fh',14+.5*h+'px');cl.classList.toggle('op',op)}

async function run(i){
 if(held===i)return;
 if(held>=0){const j=held,g=G(j);cs[j].classList.remove('open');cs[j].querySelector('.wall').inert=true;await sl(450);pile(j,850);claw(g.x,rod(g.y,g.H),g.W,g.H,850,false);await sl(850);cl.classList.add('op');held=-1;await sl(260)}
 const g=G(i);
 claw(g.x,8,g.W,g.H,750,true);await sl(750);
 claw(g.x,rod(g.y,g.H),g.W,g.H,560,true);await sl(560);
 cl.classList.remove('op');await sl(260);
 lift(i,950);claw(g.sw/2,rod(g.cy,g.H*g.k),g.W*g.k,g.H*g.k,950,false);await sl(950);

async function pick(i){clearTimeout(ht);hd.classList.remove('show');if(busy){q=i;return}busy=1;try{await run(i)}finally{busy=0}if(q!==null){const n=q;q=null;pick(n)}else hint()}

</script></body></html>
